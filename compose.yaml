services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: finora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finora_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora -d finora"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  finora_data:
